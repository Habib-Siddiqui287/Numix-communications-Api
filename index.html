<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>NUMIX - Phone Number Validity & Messaging API</title>
    <style>
        :root {
            --bg-color: #07090e;
            --card-bg: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary-green: #10b981;
            --primary-green-hover: #059669;
            --accent-red: #ef4444;
            --border-color: #1e293b;
            --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border-radius: 1.5rem;
            box-shadow: var(--shadow);
            padding: 1.5rem;
            border: 1px solid var(--border-color);
        }

        .view-section { display: none; }
        .view-section.active { display: block; }

        .home-header {
            text-align: center;
            margin-bottom: 1.75rem;
        }

        .home-logo {
            font-size: 2.25rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--primary-green);
            margin-bottom: 0.2rem;
        }

        .home-subtitle {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .nav-card {
            background: #07090e;
            border: 2px solid var(--border-color);
            border-radius: 1rem;
            padding: 1.15rem;
            margin-bottom: 0.85rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .nav-card:hover { border-color: var(--primary-green); }

        .nav-card-icon {
            font-size: 1.6rem;
            background: #0f172a;
            padding: 0.5rem;
            border-radius: 0.6rem;
            border: 1px solid var(--border-color);
        }

        .nav-card-info h3 {
            font-size: 1rem;
            color: var(--text-main);
            margin-bottom: 0.15rem;
        }

        .nav-card-info p {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .module-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .back-btn {
            background: #07090e;
            border: 1px solid var(--border-color);
            padding: 0.4rem 0.75rem;
            border-radius: 0.5rem;
            font-size: 0.8rem;
            color: var(--text-main);
            cursor: pointer;
        }

        .device-screen {
            background: #07090e;
            border-radius: 1rem;
            padding: 1rem;
            border: 2px solid var(--border-color);
            margin-bottom: 1rem;
            transition: 0.3s;
        }

        .device-screen.valid-green {
            border-color: var(--primary-green);
            background: rgba(16, 185, 129, 0.08);
        }

        .device-screen.invalid-red {
            border-color: var(--accent-red);
            background: rgba(239, 68, 68, 0.08);
        }

        .screen-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.4rem;
        }

        .status-badge {
            font-size: 0.68rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .country-badge {
            font-size: 0.75rem;
            font-weight: 700;
            color: #34d399;
            background: rgba(52, 211, 153, 0.15);
            padding: 0.15rem 0.5rem;
            border-radius: 0.3rem;
            display: none;
        }

        .display-output {
            font-size: 1.4rem;
            font-weight: 600;
            text-align: right;
            min-height: 38px;
            color: var(--text-main);
            word-break: break-all;
            display: flex;
            align-items: center;
            justify-content: flex-end;
        }

        .msg-input-field {
            width: 100%;
            background: #07090e;
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            padding: 0.6rem;
            color: var(--text-main);
            font-size: 0.9rem;
            margin-bottom: 0.6rem;
            outline: none;
        }

        .msg-input-field:focus { border-color: var(--primary-green); }

        .msg-textarea {
            width: 100%;
            height: 75px;
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            padding: 0.6rem;
            font-size: 0.85rem;
            background: #07090e;
            color: var(--text-main);
            resize: none;
            outline: none;
        }

        .msg-textarea:focus { border-color: var(--primary-green); }

        .wave-box {
            display: none;
            justify-content: center;
            align-items: center;
            gap: 4px;
            height: 20px;
            margin-top: 0.4rem;
        }

        .wave-bar {
            width: 3px;
            height: 6px;
            background: var(--primary-green);
            border-radius: 2px;
            animation: bounce 0.8s infinite ease-in-out alternate;
        }

        .wave-bar:nth-child(2) { animation-delay: 0.2s; }
        .wave-bar:nth-child(3) { animation-delay: 0.4s; }
        .wave-bar:nth-child(4) { animation-delay: 0.6s; }

        @keyframes bounce {
            0% { height: 6px; }
            100% { height: 18px; }
        }

        .keypad-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.6rem;
            margin-bottom: 1rem;
        }

        .key-btn {
            background: #07090e;
            border: 1px solid var(--border-color);
            border-radius: 0.65rem;
            padding: 0.7rem;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
            transition: 0.1s;
        }

        .key-btn:active {
            background: #1e293b;
            transform: scale(0.95);
        }

        .action-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.6rem;
        }

        .action-btn {
            padding: 0.75rem;
            border: none;
            border-radius: 0.65rem;
            font-weight: 600;
            font-size: 0.9rem;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-cancel { background: var(--accent-red); }
        .btn-cancel:hover { opacity: 0.9; }
        .btn-execute { background: var(--primary-green); }
        .btn-execute:hover { background: var(--primary-green-hover); }

        .stats-footer {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
            margin-top: 1rem;
            text-align: center;
            font-size: 0.72rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            padding-top: 0.75rem;
        }

        .stats-footer div {
            background: #07090e;
            padding: 0.3rem;
            border-radius: 0.4rem;
            border: 1px solid var(--border-color);
        }

        .stats-footer span {
            display: block;
            font-weight: 700;
            color: var(--text-main);
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- HOME PAGE -->
        <div id="viewHome" class="view-section active">
            <div class="home-header">
                <div class="home-logo">NUMIX</div>
                <div class="home-subtitle">Phone Number Validity & Messaging API</div>
            </div>

            <div class="nav-card" onclick="openModule('call')">
                <div class="nav-card-icon">📞</div>
                <div class="nav-card-info">
                    <h3>Voice Dialer Hub</h3>
                    <p>Verify country codes, 03/ +92 support & live ring tunes.</p>
                </div>
            </div>

            <div class="nav-card" onclick="openModule('message')">
                <div class="nav-card-icon">💬</div>
                <div class="nav-card-info">
                    <h3>Message Desk</h3>
                    <p>Enter recipient number & text payload validation.</p>
                </div>
            </div>
        </div>

        <!-- MODULE PAGE -->
        <div id="viewModule" class="view-section">
            <div class="module-top-bar">
                <button class="back-btn" onclick="goHome()">← Back Home</button>
                <span id="moduleTitle" style="font-size: 0.82rem; color: var(--text-muted); font-weight: 600;">Voice Dialer Hub</span>
            </div>

            <!-- Call View -->
            <div id="moduleCallContent">
                <div id="callScreenBox" class="device-screen">
                    <div class="screen-top">
                        <span id="callStatusLabel" class="status-badge">Ready to Dial</span>
                        <span id="countryBadge" class="country-badge">Unknown</span>
                    </div>
                    <div id="callDisplay" class="display-output"></div>
                    <div id="callWaveBox" class="wave-box">
                        <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
                    </div>
                </div>

                <div class="keypad-grid">
                    <button class="key-btn" onclick="pressKey('1')">1</button>
                    <button class="key-btn" onclick="pressKey('2')">2</button>
                    <button class="key-btn" onclick="pressKey('3')">3</button>
                    <button class="key-btn" onclick="pressKey('4')">4</button>
                    <button class="key-btn" onclick="pressKey('5')">5</button>
                    <button class="key-btn" onclick="pressKey('6')">6</button>
                    <button class="key-btn" onclick="pressKey('7')">7</button>
                    <button class="key-btn" onclick="pressKey('8')">8</button>
                    <button class="key-btn" onclick="pressKey('9')">9</button>
                    <button class="key-btn" onclick="pressKey('+')">+</button>
                    <button class="key-btn" onclick="pressKey('0')">0</button>
                    <button class="key-btn" onclick="deleteKey()">⌫</button>
                </div>
            </div>

            <!-- Message View -->
            <div id="moduleMsgContent" style="display: none;">
                <div id="msgScreenBox" class="device-screen">
                    <div class="screen-top">
                        <span id="msgStatusLabel" class="status-badge">Compose Message</span>
                        <span id="msgCountryBadge" class="country-badge">Unknown</span>
                    </div>
                    <input type="text" id="msgNumberInput" class="msg-input-field" placeholder="Enter recipient number (e.g. 0322... or +92...)" oninput="evaluateMessageNumber()">
                    <textarea id="msgBodyInput" class="msg-textarea" placeholder="Type text message payload..."></textarea>
                    <div id="msgWaveBox" class="wave-box">
                        <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
                    </div>
                </div>
            </div>

            <!-- Action Controls (Clean professional look without circles) -->
            <div class="action-row">
                <button class="action-btn btn-cancel" onclick="cancelAction()">Cancel</button>
                <button class="action-btn btn-execute" onclick="executeAction()"><span id="execText">Call</span></button>
            </div>
        </div>

        <!-- Footer Stats -->
        <div class="stats-footer">
            <div>Total <span id="statTotal">0</span></div>
            <div>Success <span id="statSuccess" style="color: var(--primary-green);">0</span></div>
            <div>Failed <span id="statFailed" style="color: var(--accent-red);">0</span></div>
        </div>
    </div>

    <script>
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // Keypad digit touch beep
        function playBeep() {
            try {
                initAudio();
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.value = 850;
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } catch(e) {}
        }

        // Real phone ringing tune (Dual-frequency)
        let ringInterval = null;
        function playRingTone() {
            try {
                initAudio();
                let osc1 = audioCtx.createOscillator();
                let osc2 = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc1.frequency.value = 440;
                osc2.frequency.value = 480;
                gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1.2);
                osc1.connect(gain);
                osc2.connect(gain);
                gain.connect(audioCtx.destination);
                osc1.start(); osc2.start();
                osc1.stop(audioCtx.currentTime + 1.2);
                osc2.stop(audioCtx.currentTime + 1.2);
            } catch(e) {}
        }

        // 20 Famous Country Codes Database with exact length requirements
        const countries = [
            { code: '+92', name: 'Pakistan 🇵🇰', exactLen: 12 },  // e.g. +923224631874
            { code: '+91', name: 'India 🇮🇳', exactLen: 13 },
            { code: '+1', name: 'USA/Canada 🇺🇸', exactLen: 12 },
            { code: '+44', name: 'United Kingdom 🇬🇧', exactLen: 13 },
            { code: '+966', name: 'Saudi Arabia 🇸🇦', exactLen: 13 },
            { code: '+971', name: 'UAE 🇦🇪', exactLen: 12 },
            { code: '+86', name: 'China 🇨🇳', exactLen: 14 },
            { code: '+81', name: 'Japan 🇯🇵', exactLen: 12 },
            { code: '+49', name: 'Germany 🇩🇪', exactLen: 13 },
            { code: '+33', name: 'France 🇫🇷', exactLen: 11 },
            { code: '+61', name: 'Australia 🇦🇺', exactLen: 11 },
            { code: '+55', name: 'Brazil 🇧🇷', exactLen: 13 },
            { code: '+7', name: 'Russia 🇷🇺', exactLen: 12 },
            { code: '+39', name: 'Italy 🇮🇹', exactLen: 12 },
            { code: '+34', name: 'Spain 🇪🇸', exactLen: 10 },
            { code: '+82', name: 'South Korea 🇰🇷', exactLen: 12 },
            { code: '+20', name: 'Egypt 🇪🇬', exactLen: 13 },
            { code: '+27', name: 'South Africa 🇿🇦', exactLen: 11 },
            { code: '+90', name: 'Turkey 🇹🇷', exactLen: 12 },
            { code: '+52', name: 'Mexico 🇲🇽', exactLen: 12 }
        ];

        let mode = 'call';
        let numberVal = "";
        let timers = [];
        let stats = { total: 0, success: 0, failed: 0 };

        function openModule(m) {
            initAudio();
            mode = m;
            document.getElementById('viewHome').classList.remove('active');
            document.getElementById('viewModule').classList.add('active');

            if (m === 'call') {
                document.getElementById('moduleTitle').innerText = "Voice Dialer Hub";
                document.getElementById('moduleCallContent').style.display = 'block';
                document.getElementById('moduleMsgContent').style.display = 'none';
                document.getElementById('execText').innerText = "Call";
            } else {
                document.getElementById('moduleTitle').innerText = "Message Desk";
                document.getElementById('moduleCallContent').style.display = 'none';
                document.getElementById('moduleMsgContent').style.display = 'block';
                document.getElementById('execText').innerText = "Send";
            }
            cancelAction();
        }

        function goHome() {
            cancelAction();
            document.getElementById('viewModule').classList.remove('active');
            document.getElementById('viewHome').classList.add('active');
        }

        // Helper to normalize local numbers starting with 0 (like 0322...) into +92 format for verification
        function parseNumberInput(str) {
            let cleaned = str.trim();
            if (cleaned.startsWith('0')) {
                cleaned = '+92' + cleaned.slice(1);
            }
            return cleaned;
        }

        function evaluateNumber(str) {
            let badge = document.getElementById('countryBadge');
            let screen = document.getElementById('callScreenBox');
            let label = document.getElementById('callStatusLabel');

            let processedStr = parseNumberInput(str);
            let sorted = [...countries].sort((a,b) => b.code.length - a.code.length);
            let found = null;
            for (let c of sorted) {
                if (processedStr.startsWith(c.code)) { 
                    found = c; 
                    break; 
                }
            }

            if (found) {
                badge.innerText = found.name;
                badge.style.display = 'inline-block';

                if (processedStr.length === found.exactLen) {
                    screen.className = "device-screen valid-green";
                    label.style.color = "var(--primary-green)";
                    label.innerText = `Ready: ${found.name} (Valid)`;
                } else {
                    screen.className = "device-screen invalid-red";
                    label.style.color = "var(--accent-red)";
                    label.innerText = `Typing... (${processedStr.length}/${found.exactLen} digits)`;
                }
            } else {
                badge.style.display = 'none';
                if (str.length > 0) {
                    screen.className = "device-screen invalid-red";
                    label.style.color = "var(--accent-red)";
                    label.innerText = "Error: Invalid prefix or code";
                } else {
                    screen.className = "device-screen";
                    label.style.color = "var(--text-muted)";
                    label.innerText = "Ready to Dial";
                }
            }
            return { found, processedStr };
        }

        function evaluateMessageNumber() {
            let numInput = document.getElementById('msgNumberInput').value;
            let badge = document.getElementById('msgCountryBadge');
            let processedStr = parseNumberInput(numInput);

            let sorted = [...countries].sort((a,b) => b.code.length - a.code.length);
            let found = null;
            for (let c of sorted) {
                if (processedStr.startsWith(c.code)) { found = c; break; }
            }

            if (found) {
                badge.innerText = found.name;
                badge.style.display = 'inline-block';
            } else {
                badge.style.display = 'none';
            }
        }

        function pressKey(val) {
            initAudio();
            if (numberVal.length < 15) {
                playBeep();
                numberVal += val;
                document.getElementById('callDisplay').innerText = numberVal;
                evaluateNumber(numberVal);
            }
        }

        function deleteKey() {
            initAudio();
            if (numberVal.length > 0) {
                playBeep();
                numberVal = numberVal.slice(0, -1);
                document.getElementById('callDisplay').innerText = numberVal;
                evaluateNumber(numberVal);
            }
        }

        function clearAll() {
            timers.forEach(t => clearTimeout(t));
            timers = [];
            if (ringInterval) { clearInterval(ringInterval); ringInterval = null; }
        }

        function cancelAction() {
            clearAll();
            if (mode === 'call') {
                numberVal = "";
                document.getElementById('callDisplay').innerText = "";
                document.getElementById('callScreenBox').className = "device-screen";
                document.getElementById('callStatusLabel').innerText = "Ready to Dial";
                document.getElementById('countryBadge').style.display = "none";
                document.getElementById('callWaveBox').style.display = "none";
            } else {
                document.getElementById('msgNumberInput').value = "";
                document.getElementById('msgBodyInput').value = "";
                document.getElementById('msgScreenBox').className = "device-screen";
                document.getElementById('msgStatusLabel').innerText = "Compose Message";
                document.getElementById('msgCountryBadge').style.display = "none";
                document.getElementById('msgWaveBox').style.display = "none";
            }
        }

        function startRingSequence() {
            let wave = mode === 'call' ? document.getElementById('callWaveBox') : document.getElementById('msgWaveBox');
            wave.style.display = "flex";
            playRingTone();
            let count = 1;

            ringInterval = setInterval(() => {
                if (count < 3) {
                    playRingTone();
                    count++;
                } else {
                    clearInterval(ringInterval);
                    ringInterval = null;
                }
            }, 2500);
            timers.push(ringInterval);

            let stop = setTimeout(() => { wave.style.display = "none"; }, 7500);
            timers.push(stop);
        }

        function executeAction() {
            initAudio();
            clearAll();
            stats.total++;

            if (mode === 'call') {
                let evalRes = evaluateNumber(numberVal);
                let isValid = (evalRes.found && evalRes.processedStr.length === evalRes.found.exactLen);
                let box = document.getElementById('callScreenBox');
                let label = document.getElementById('callStatusLabel');
                let wave = document.getElementById('callWaveBox');

                if (isValid) {
                    stats.success++;
                    box.className = "device-screen valid-green";
                    label.style.color = "var(--primary-green)";
                    label.innerText = `Calling ${evalRes.found.name}...`;

                    let t = setTimeout(() => { startRingSequence(); }, 300);
                    timers.push(t);
                } else {
                    stats.failed++;
                    box.className = "device-screen invalid-red";
                    label.style.color = "var(--accent-red)";
                    label.innerText = "Error: Incomplete or Invalid Number";
                    wave.style.display = "none";
                }
            } else {
                let numInput = document.getElementById('msgNumberInput').value.trim();
                let bodyInput = document.getElementById('msgBodyInput').value.trim();
                let processedStr = parseNumberInput(numInput);
                
                let sorted = [...countries].sort((a,b) => b.code.length - a.code.length);
                let found = null;
                for (let c of sorted) {
                    if (processedStr.startsWith(c.code)) { found = c; break; }
                }

                let isValid = (found && processedStr.length === found.exactLen && bodyInput.length > 0);
                let box = document.getElementById('msgScreenBox');
                let label = document.getElementById('msgStatusLabel');
                let wave = document.getElementById('msgWaveBox');

                if (isValid) {
                    stats.success++;
                    box.className = "device-screen valid-green";
                    label.style.color = "var(--primary-green)";
                    label.innerText = `Message Sent to ${found.name}!`;

                    let t = setTimeout(() => { startRingSequence(); }, 300);
                    timers.push(t);
                } else {
                    stats.failed++;
                    box.className = "device-screen invalid-red";
                    label.style.color = "var(--accent-red)";
                    label.innerText = "Error: Invalid Number or Empty Message";
                    wave.style.display = "none";
                }
            }

            document.getElementById('statTotal').innerText = stats.total;
            document.getElementById('statSuccess').innerText = stats.success;
            document.getElementById('statFailed').innerText = stats.failed;
        }
    </script>
</body>
</html>
