<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telephony & Messaging Dashboard</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --primary: #10b981;
            --primary-hover: #059669;
            --success-color: #10b981;
            --error-color: #ef4444;
            --border-color: #e2e8f0;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .dashboard-container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 1rem;
            box-shadow: var(--shadow);
            padding: 1.5rem;
            border: 1px solid var(--border-color);
        }

        .active-view {
            display: block;
        }

        .header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .header h2 {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .phone-body {
            background: #f1f5f9;
            border-radius: 0.75rem;
            padding: 1rem;
            margin-bottom: 1.25rem;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .phone-body.success-active {
            border-color: var(--success-color);
            background: #ecfdf5;
        }

        .phone-body.alarm-active {
            border-color: var(--error-color);
            background: #fef2f2;
        }

        .display-screen {
            background: #ffffff;
            padding: 1rem;
            border-radius: 0.5rem;
            text-align: right;
            font-size: 1.5rem;
            font-weight: 500;
            letter-spacing: 1px;
            margin-bottom: 1rem;
            border: 1px solid var(--border-color);
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            word-break: break-all;
        }

        .status-panel {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .key-btn {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            padding: 1rem;
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .key-btn:active {
            background: #e2e8f0;
            transform: scale(0.97);
        }

        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }

        .btn {
            padding: 0.75rem 1rem;
            border: none;
            border-radius: 0.5rem;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .btn-danger {
            background: var(--error-color);
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
            margin-top: 1rem;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .stats-grid div {
            background: #f8fafc;
            padding: 0.5rem;
            border-radius: 0.4rem;
            border: 1px solid var(--border-color);
        }

        .stats-grid span {
            display: block;
            font-weight: 700;
            color: var(--text-main);
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <div id="viewDashboard" class="active-view">
            <div class="header">
                <h2 id="lblContext">Voice Channel Ready</h2>
            </div>

            <div id="callPhoneBody" class="phone-body">
                <div class="status-panel">
                    <span id="callStatusAlert">Enter number</span>
                </div>
                <div id="displayScreen" class="display-screen"></div>
                
                <div class="keypad">
                    <button class="key-btn" onclick="pressKey('1')">1</button>
                    <button class="key-btn" onclick="pressKey('2')">2</button>
                    <button class="key-btn" onclick="pressKey('3')">3</button>
                    <button class="key-btn" onclick="pressKey('4')">4</button>
                    <button class="key-btn" onclick="pressKey('5')">5</button>
                    <button class="key-btn" onclick="pressKey('6')">6</button>
                    <button class="key-btn" onclick="pressKey('7')">7</button>
                    <button class="key-btn" onclick="pressKey('8')">8</button>
                    <button class="key-btn" onclick="pressKey('9')">9</button>
                    <button class="key-btn" onclick="pressKey('+')">+</button>
                    <button class="key-btn" onclick="pressKey('0')">0</button>
                    <button class="key-btn" onclick="pressDelete()">⌫</button>
                </div>

                <div class="action-buttons">
                    <button class="btn btn-danger" onclick="terminateCallSession()">Cancel</button>
                    <button class="btn btn-primary" onclick="executeSystemAction()">Execute</button>
                </div>
            </div>

            <div class="stats-grid">
                <div>Total <span id="statTotal">0</span></div>
                <div>Success <span id="statSuccess" style="color: var(--success-color);">0</span></div>
                <div>Failed <span id="statFailed" style="color: var(--error-color);">0</span></div>
            </div>
        </div>
    </div>

    <script>
        let callNumber = "";
        let currentModuleMode = 'call';
        let selectedLang = 'en';
        let activeBeepTimeouts = [];
        let cumulativeCounters = { total: 0, success: 0, failed: 0 };

        function checkInputFormatPattern(num) {
            // Basic international / local validation check (e.g. min length 7 digits)
            const cleanNum = num.replace(/\D/g, '');
            return cleanNum.length >= 7;
        }

        function pressKey(val) {
            if (callNumber.length < 15) {
                callNumber += val;
                updateDisplay();
            }
        }

        function pressDelete() {
            callNumber = callNumber.slice(0, -1);
            updateDisplay();
        }

        function updateDisplay() {
            document.getElementById('displayScreen').innerText = callNumber;
        }

        function forceKillAudioEngine() {
            // Clear all pending ringing timeouts instantly upon cancel/terminate
            activeBeepTimeouts.forEach(timeoutId => clearTimeout(timeoutId));
            activeBeepTimeouts = [];
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
        }

        function playVoiceResponse(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = selectedLang === 'ur' ? 'ur-PK' : 'en-US';
                window.speechSynthesis.speak(utterance);
            }
        }

        function playTelephonyBeepSequence(times) {
            for (let i = 0; i < times; i++) {
                let tid = setTimeout(() => {
                    // Check if session hasn't been terminated
                    playVoiceResponse("Ringing...");
                }, i * 2500);
                activeBeepTimeouts.push(tid);
            }
        }

        function terminateCallSession() {
            forceKillAudioEngine();
            callNumber = "";
            updateDisplay();

            const bodyEl = document.getElementById('callPhoneBody');
            bodyEl.className = "phone-body";
            document.getElementById('callStatusAlert').innerText = "Cancelled / Reset";
            document.getElementById('lblContext').innerText = "Voice Channel Ready";
        }

        function executeSystemAction() {
            if (callNumber === "") return;
            let isValid = checkInputFormatPattern(callNumber);

            const bodyEl = document.getElementById('callPhoneBody');
            const alertEl = document.getElementById('callStatusAlert');
            const lblContext = document.getElementById('lblContext');

            forceKillAudioEngine();
            cumulativeCounters.total++;

            bodyEl.classList.remove('success-active', 'alarm-active');

            if (isValid) {
                cumulativeCounters.success++;
                bodyEl.className = "phone-body success-active";
                alertEl.style.color = "var(--success-color)";
                alertEl.innerText = "Number is correct";
                lblContext.innerText = "Voice Channel Up (Green Verified)";
                
                playVoiceResponse("Your dialed number is correct.");
                
                // Ring exactly 3 times max, strictly adhering to cancellation safety
                let initialDelay = setTimeout(() => {
                    playTelephonyBeepSequence(3);
                }, 2000);
                activeBeepTimeouts.push(initialDelay);

            } else {
                cumulativeCounters.failed++;
                bodyEl.className = "phone-body alarm-active";
                alertEl.style.color = "var(--error-color)";
                alertEl.innerText = "Blocked / Invalid Format";
                lblContext.innerText = "Format Pattern Dropout";
                
                playVoiceResponse("Incorrect number format.");
            }

            document.getElementById('statTotal').innerText = cumulativeCounters.total;
            document.getElementById('statSuccess').innerText = cumulativeCounters.success;
            document.getElementById('statFailed').innerText = cumulativeCounters.failed;
        }

        document.addEventListener('keydown', function(event) {
            let key = event.key;
            if (/[0-9]/.test(key)) pressKey(key);
            else if (key === '+') pressKey('+');
            else if (key === 'Backspace') pressDelete();
            else if (key === 'Enter') executeSystemAction();
            else if (key === 'Escape') terminateCallSession();
        });
    </script>
</body>
</html>
